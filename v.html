<script>
const cv=document.getElementById('c');let ctx=cv.getContext('2d');
const DIFFS=['Легкий','Средний','Сложный'];
const TC=['#FF00FF','#00FFFF','#FFD700','#FF4500','#9400D3','#32CD32'];
const R=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];
let W=0,H=0,diff='Средний',score=0,paused=false,bullet=false,name='Игрок',spawnT=0,t=0;
let comet=null,stars=[],sparks=[],expl=[],lasers=[],sky=[],dust=[],hs={};
let warp=[],wdt=1,barHid=false;

try{hs=JSON.parse(localStorage.getItem('hs')||'{}');name=localStorage.getItem('nm')||name;pendS=+localStorage.getItem('ps')||0;{const pp=JSON.parse(localStorage.getItem('pp')||'{}');pendSc=+pp.sc||0;pendSec=+pp.sec||0}}catch(e){}

function resize(){
  const d=DPR=window.devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;
  cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);
  sky=Array.from({length:Math.round(W*H/4500)},()=>({x:R(0,W),y:R(0,H),r:pick([1,1,1,2,2]),p:R(0,6.28),s:R(.5,2)}));
  initWarp();
  vig=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.3,W/2,H/2,Math.hypot(W,H)*.55);vig.addColorStop(0,'rgba(0,0,0,0)');vig.addColorStop(1,'rgba(0,0,0,1)');

addEventListener('resize',resize);
function glow(px,py,r,rgb,a){

function mkSprite(hue,sup){
  const c=document.createElement('canvas');c.width=c.height=96;const g=c.getContext('2d');g.scale(1.5,1.5);
  let gr=g.createRadialGradient(32,32,0,32,32,32);

  gr.addColorStop(.35,sup?'rgba(255,170,0,.3)':`hsla(${hue},100%,60%,.18)`);gr.addColorStop(1,'rgba(0,0,0,0)');

  g.beginPath();

}
const SPR=Array.from({length:12},(_,i)=>mkSprite(i*30+15,false)),SUPS=mkSprite(0,true);
const SK={star:{a:SPR,s:SUPS}};let curS=SK.star;
function mkRare(kind){
  const c=document.createElement('canvas');c.width=c.height=96;const g=c.getContext('2d');g.scale(1.5,1.5);
  const ice=kind==='ice',P=Math.PI,cs=Math.cos,sn=Math.sin;
  let gr=g.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,ice?'rgba(170,235,255,.75)':'rgba(255,70,45,.75)');gr.addColorStop(.35,ice?'rgba(110,200,255,.3)':'rgba(255,40,20,.3)');gr.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=gr;g.fillRect(0,0,64,64);g.lineCap='round';g.lineJoin='round';
  if(ice){
    for(const [col,lw] of [['#7fd0ff',3.2],['#eefaff',1.1]]){
      g.strokeStyle=col;g.lineWidth=lw;
      for(let i=0;i<6;i++){const a=i*P/3;g.beginPath();g.moveTo(32,32);g.lineTo(32+17*cs(a),32+17*sn(a));
        for(const d of[-1,1]){const bx=32+10*cs(a),by=32+10*sn(a),ba=a+d*.9;g.moveTo(bx,by);g.lineTo(bx+6*cs(ba),by+6*sn(ba))}g.stroke()}
    }
    gr=g.createRadialGradient(32,32,0,32,32,6);gr.addColorStop(0,'#fff');gr.addColorStop(1,'#8fdcff');g.fillStyle=gr;g.beginPath();g.arc(32,32,5.5,0,6.28);g.fill();
  }else{

function drawLaser(l){
  const k=Math.max(0,l.life/l.max),e=1-k,fl=.85+.15*Math.sin(t*90+l.seed);
  const dx=l.x2-l.x1,dy=l.y2-l.y1,len=Math.hypot(dx,dy)||1,ux=dx/len,uy=dy/len;
  const wk=.35+.65*k,A=Math.pow(k,.6)*fl;
  const lc=lasCur(),H=lc.rb?(t*100+l.seed*50)%360:lc.h,S=lc.s,rg=L=>h2r(H,S,L);
  ctx.save();ctx.globalCompositeOperation='lighter';ctx.lineCap='round';
  // сходящиеся лучи из чаши (как у суперлазера)
  const fx=l.x1+ux*l.dr*1.5,fy=l.y1+uy*l.dr*1.5;
  ctx.lineWidth=1.5;ctx.strokeStyle='rgb('+rg(74)+')';
  for(let i=0;i<6;i++){
    const a=l.seed+i*Math.PI/3+e*1.2,sx=l.x1+Math.cos(a)*l.dr*.95,sy=l.y1+Math.sin(a)*l.dr*.95;
    ctx.globalAlpha=.55*k;ctx.beginPath();ctx.moveTo(sx,sy);
    ctx.quadraticCurveTo(l.x1+Math.cos(a+.9)*l.dr*.55+ux*l.dr*.6,l.y1+Math.sin(a+.9)*l.dr*.55+uy*l.dr*.6,fx,fy);ctx.stroke();
  }
  // основной луч: слои свечения с градиентом (горячее у источника)
  const g=ctx.createLinearGradient(l.x1,l.y1,l.x2,l.y2);
  const layers=[[28,rg(58),.09],[15,rg(62),.2],[7,rg(79),.5],[3,rg(96),.95]];
  for(const [w,rgb,a] of layers){
    g.addColorStop(0,`rgba(${rgb},${a})`);g.addColorStop(.5,`rgba(${rgb},${a*.8})`);g.addColorStop(1,`rgba(${rgb},${a})`);
    ctx.strokeStyle=g;ctx.globalAlpha=A;ctx.lineWidth=w*wk;
    ctx.beginPath();ctx.moveTo(l.x1,l.y1);ctx.lineTo(l.x2,l.y2);ctx.stroke();
  }
  // бегущие энергетические «бусины»
  ctx.fillStyle='rgb('+rg(95)+')';
  for(let j=0;j<7;j++){
    const p=((t*2.2+j/7+l.seed)%1),bx=l.x1+dx*p,by=l.y1+dy*p;
    ctx.globalAlpha=.8*k;ctx.beginPath();ctx.arc(bx,by,1.6+1.2*k,0,6.28);ctx.fill();
  }
  // вспышка у чаши
  glow(l.x1,l.y1,l.dr*(1.1+.8*k),rg(75),.85*k);
  // вспышка и кольцо в точке попадания
  glow(l.x2,l.y2,24+34*k+e*18,rg(77),.7*k);
  glow(l.x2,l.y2,11*(.5+k),'255,255,255',.9*k);
  ctx.strokeStyle='rgb('+rg(82)+')';ctx.lineWidth=.5+2*k;ctx.globalAlpha=.8*k;
  ctx.beginPath();ctx.arc(l.x2,l.y2,6+e*38,0,6.28);ctx.stroke();
  ctx.lineWidth=1.2;ctx.globalAlpha=.85*k;
  for(let j=0;j<4;j++){
    const a=l.seed+j*Math.PI/4,r=(10+22*k)*(1+e*.5);
    ctx.beginPath();ctx.moveTo(l.x2-Math.cos(a)*r,l.y2-Math.sin(a)*r);ctx.lineTo(l.x2+Math.cos(a)*r,l.y2+Math.sin(a)*r);ctx.stroke();
  }
  ctx.restore();ctx.globalAlpha=1;ctx.lineWidth=1;
}

  glow(c.x,c.y,c.r*1.7,'255,170,90',.35);

  b.addColorStop(0,'#ffffff');b.addColorStop(.4,'#d6f1ff');b.addColorStop(.8,'#5c9fd0');b.addColorStop(1,'#2d5f8f');

  ctx.restore();

  ctx.save();ctx.globalCompositeOperation='lighter';ctx.fillStyle='#fff';
  for(let j=0;j<4;j++){
    const a=tm*3+j*1.57,d=c.r*(1.15+.25*Math.sin(tm*5+j)),sx=c.x+Math.cos(a)*d,sy=c.y+Math.sin(a)*d,s=c.r*.14;

async function initAuth(){
  if(!sb){authState='none';return}
  try{await loadProfile()}catch(e){authState='err'}
}
function authHTML(B,p){

async function doLogin(){
  const er=MD.querySelector('#rerr'),em=MD.querySelector('#em').value.trim(),pw=MD.querySelector('#pw').value;
  if(!em||!pw){er.textContent='Введите почту и пароль';return}
  er.textContent='Входим…';
  try{
    const r=await sb.auth.signInWithPassword({email:em,password:pw});
    if(r.error){er.textContent=/confirm/i.test(r.error.message)?'Сначала подтвердите почту по письму':'Неверная почта или пароль';return}
    await loadProfile();
    if(authState==='ok'){if(entryLogin){entryLogin=false;showMenu('main');dailyEnter()}else start()}else er.textContent='Профиль не найден';
  }catch(e){er.textContent='Ошибка связи с сервером'}
}
async function doForgot(){
  const er=MD.querySelector('#rerr'),em=MD.querySelector('#em').value.trim();
  if(!/^\S+@\S+\.\S+$/.test(em)){er.style.color='';er.textContent='Введите корректную почту';return}
  er.style.color='';er.textContent='Отправляем…';
  try{
    const r=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});
    if(r.error){er.textContent=/rate|seconds/i.test(r.error.message)?'Слишком часто, подождите минуту':'Ошибка: '+r.error.message;return}
    er.style.color='#8affb0';er.textContent='Письмо отправлено. Откройте ссылку из него.';
  }catch(e){er.textContent='Ошибка связи с сервером'}
}
async function doNewPw(){
  const er=MD.querySelector('#rerr'),pw=MD.querySelector('#pw').value;
  if(pw.length<8){er.textContent='Пароль: минимум 8 символов';return}
  er.textContent='Сохраняем…';
  try{
    const r=await sb.auth.updateUser({password:pw});
    if(r.error){er.textContent=/same|different/i.test(r.error.message)?'Новый пароль должен отличаться от старого':'Ошибка: '+r.error.message;return}
    recov=false;try{history.replaceState(null,'',location.pathname)}catch(e){}
    await loadProfile();showMenu('main');dailyEnter();
  }catch(e){er.textContent='Ошибка связи с сервером'}
}
async function doReg(){
  const er=MD.querySelector('#rerr');if(!er)return;
  const em=MD.querySelector('#em').value.trim(),pw=MD.querySelector('#pw').value;
  const nick=(MD.querySelector('#rn').value||'').trim().replace(/\s+/g,' ');
  if(nick.length<3||nick.length>16){er.textContent='Ник: от 3 до 16 символов';return}
  if(!/^[\p{L}\p{N}_\- ]+$/u.test(nick)){er.textContent='Ник: только буквы, цифры, пробел, _ и -';return}
  if(!/^\S+@\S+\.\S+$/.test(em)){er.textContent='Введите корректную почту';return}
  if(pw.length<8){er.textContent='Пароль: минимум 8 символов';return}
  er.textContent='Проверяем…';
  try{
    const c=await sb.rpc('nick_taken',{n:nick});
    if(c.error)throw c.error;
    if(c.data){er.textContent='Никнейм «'+nick+'» занят';return}
    const r=await sb.auth.signUp({email:em,password:pw,options:{data:{nick}}});
    if(r.error){er.textContent=/database/i.test(r.error.message)?'Никнейм «'+nick+'» занят':/registered/i.test(r.error.message)?'Эта почта уже зарегистрирована':'Ошибка: '+r.error.message;return}
    if(r.data.user&&r.data.user.identities&&r.data.user.identities.length===0){er.textContent='Эта почта уже зарегистрирована';return}
    if(r.data.session){await loadProfile();if(entryLogin){entryLogin=false;showMenu('main');dailyEnter()}else start();return}
    showMenu('login');
    const e2=MD.querySelector('#rerr');e2.style.color='#8affb0';e2.textContent='Готово! Мы отправили письмо: подтвердите почту и войдите.';
  }catch(e){er.textContent='Ошибка связи с сервером'}
}
async function loadTop(key){

  if(!sb)return fail('Нет связи с сервером');

  try{
    if(c.k==='s'){
      const r=await sb.from('scores').select('score,profiles(nick)').eq('difficulty',c.d).order('score',{ascending:false}).limit(100);
      if(r.error)throw 0;rows=r.data.map(x=>[x.profiles?x.profiles.nick:'?',x.score]);
      my=Math.max((hs[c.d]||{})[name]||0,mine[c.d]||0);
      if(!my&&authState==='ok'&&!rows.some(x=>x[0]===name)){const m=await sb.from('scores').select('score,profiles!inner(nick)').eq('difficulty',c.d).eq('profiles.nick',name).limit(1);if(!m.error&&m.data[0])my=m.data[0].score}
    }else{
      const col=c.k==='t'?'best_time':'total_stars',r=await sb.from('profiles').select('nick,'+col).order(col,{ascending:false}).limit(100);
      if(r.error)throw 0;rows=r.data.filter(x=>x[col]>0).map(x=>[x.nick,x[col]]);
      my=c.k==='t'?Math.floor(bestT):tot;fmt=c.k==='t'?fmtT:fmtN;
    }
  }catch(e){return fail('Ошибка загрузки')}
  if(MD.querySelector('#tl')!==L)return;
  const medal=['🥇','🥈','🥉'],row=(rk,n,v,me)=>`<div class="it${me?' me':''}" data-a="pl" data-n="${esc(n)}"><span class="rk">${rk}</span><span class="nm">${esc(n)}</span><span class="vl">${v}</span></div>`;
  L.innerHTML=rows.length?rows.map((x,i)=>row(medal[i]||i+1,x[0],fmt(x[1]),x[0]===name)).join(''):'<div class="it">Пока пусто</div>';
  if(authState==='ok'&&!rows.some(x=>x[0]===name))F.innerHTML=row('—',name,my>0?fmt(my):'—',true);

const saveP=()=>{try{localStorage.setItem('pp',JSON.stringify({sc:pendSc,sec:pendSec}))}catch(e){}};
async function pushStats(){
  const tm=Math.floor(bestT);
  if(!sb||authState!=='ok'||(!pendS&&!pendSc&&pendSec<1&&tm<=btSent))return;
  const n=pendS,sc=pendSc,sec=Math.floor(pendSec);pendS=0;pendSc=0;pendSec-=sec;saveP();try{localStorage.setItem('ps',0)}catch(e){}
  try{
    let r=await sb.rpc('submit_stats',{add_stars:n,t:tm,add_score:sc,add_secs:sec});
    if(r.error&&(sc||sec)){r=await sb.rpc('submit_stats',{add_stars:n,t:tm});if(!r.error){pendSc+=sc;pendSec+=sec}}
    if(r.error)throw r.error;btSent=Math.max(btSent,tm);
  }catch(e){lastPushErr=(e&&e.message)||String(e);pendS+=n;pendSc+=sc;pendSec+=sec;try{localStorage.setItem('ps',pendS)}catch(x){}}
  saveP();
}
function pushScore(){
  if(!sb||authState!=='ok'||!pend)return;
  const p=pend;pend=null;
  sb.rpc('submit_score',{d:p.d,s:p.s}).then(r=>{if(r.error&&!pend)pend=p});
}
const pushAll=()=>{saveP();pushScore();pushStats()};
setInterval(pushAll,8000);
addEventListener('pagehide',pushAll);
document.addEventListener('visibilitychange',()=>{if(document.hidden)pushAll()});

// ---------- Ежедневная награда ----------
let dg={loaded:false,streak:0,can:false,left:0,next:1,at:0,rewards:[100,150,200,300,400,500,1000]},dgPop=false,dgMsg='',dgBad=false,dgVis=false,dgDot=false;
const dgLeft=()=>Math.max(0,Math.ceil(dg.left-(performance.now()-dg.at)/1000));
const dgCan=()=>dg.loaded&&(dg.can||dgLeft()===0);
const fmtHMS=v=>{const h=v/3600|0,m=v%3600/60|0,x=v%60,p=n=>String(n).padStart(2,'0');return p(h)+':'+p(m)+':'+p(x)};
const dayW=n=>{const a=n%100,b=n%10;return a>10&&a<15?'дней':b===1?'день':b>1&&b<5?'дня':'дней'};
function dgSet(d){
  dg.streak=+d.streak||0;dg.can=!!d.can;dg.left=+d.left||0;dg.next=+d.next_day||1;dg.at=performance.now();dg.loaded=true;
  if(Array.isArray(d.rewards)&&d.rewards.length===7)dg.rewards=d.rewards.map(Number);
}
async function dgRefresh(){
  try{const r=await sb.rpc('get_daily');if(r.error||!r.data)return false;dgSet(r.data);return true}catch(e){return false}
}
async function dailyEnter(){
  if(!sb||authState!=='ok')return;
  await dgRefresh();
  if(dgCan()&&!dgPop&&curP==='main'){dgPop=true;showMenu('daily')}
}
function openDaily(){
  showMenu('daily');
  dgRefresh().then(ok=>{if(ok&&curP==='daily')showMenu('daily')});
}
function dailyHTML(B){
  const R=dg.rewards,cl=dgCan(),nd=dg.next||1,sk=dg.streak||0;
  const done=cl?nd-1:(sk>0?((sk-1)%7)+1:0);
  const cells=R.map((v,i)=>{const d=i+1,cls=d<=done?'done':(cl&&d===nd?'now':''),tx=d<=done?'Получено':(cl&&d===nd?'Сегодня':'');
    return `<div class="dc ${cls}${d===7?' big':''}"><span>День ${d}</span><b>+${fmtN(v)} ★</b><span class="t">${tx}</span></div>`}).join('');
  const msg=dgMsg,bad=dgBad;dgMsg='';dgBad=false;
  const act=cl?B('dclaim','Забрать +'+fmtN(R[nd-1])+' ★'):`<div class="dtm-l">Следующая награда через</div><div class="dtm" id="dtm">${fmtHMS(dgLeft())}</div>`;
  return '<h2>Ежедневная награда</h2><div class="chips"><span class="chip">Серия: '+sk+' '+dayW(sk)+'</span></div><div class="wk">'+cells+'</div>'
    +`<div class="dmsg${bad?' bad':''}">${msg}</div>`+act
    +'<p style="text-align:center;opacity:.7">Награду можно забрать раз в 24 часа. Если пропустить больше суток, серия начнётся заново.</p>'
    +B('back','← Назад','lnk');
}
async function claimDaily(){
  const b=MD.querySelector('[data-a=dclaim]');if(b)b.disabled=true;

    const r=await sb.rpc('claim_daily');if(r.error||!r.data)throw r.error||0;

function dlShortcut(){
  const u=location.href.split('#')[0].split('?')[0];
  const b=new Blob(['[InternetShortcut]\r\nURL='+u+'\r\nIconIndex=0\r\n'],{type:'application/octet-stream'});
  const a=document.createElement('a'),url=URL.createObjectURL(b);a.href=url;a.download='Luminary.url';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);
}
$('ib').onclick=async()=>{
  if(dip){const e=dip;dip=null;e.prompt();try{const r=await e.userChoice;if(r.outcome==='accepted')instDone=true}catch(x){}return}

};

(()=>{
  if(standalone()||!matchMedia('(pointer:coarse)').matches)return;
  const de=document.documentElement,rq=de.requestFullscreen||de.webkitRequestFullscreen;
  if(!rq)return;
  const go=()=>{
    removeEventListener('pointerup',go,true);removeEventListener('click',go,true);
    if(document.fullscreenElement||document.webkitFullscreenElement)return;
    try{const p=rq.call(de,{navigationUI:'hide'});if(p&&p.catch)p.catch(()=>{})}catch(e){}
  };
  addEventListener('pointerup',go,true);addEventListener('click',go,true);
})();
